
name: Deploy Lumina Store Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Web/**'
      - '.github/workflows/deploy-lumina-web.yml'

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Web/Shop.Web.csproj

      - name: Build frontend
        run: dotnet build Web/Shop.Web.csproj --configuration Release --no-restore

      - name: Publish frontend
        run: dotnet publish Web/Shop.Web.csproj --configuration Release --output ./publish/web --no-build

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy frontend to staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.APP_NAME }}
          slot-name: staging
          package: ./publish/web
