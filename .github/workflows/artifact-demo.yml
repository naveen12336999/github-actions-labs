name: Artifact Demo

on:
  push:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create File
        run: echo "Hello Artifact" > myfile.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: myfile.txt

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: my-artifact

      - name: Show File
        run: cat myfile.txt
