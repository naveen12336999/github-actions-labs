name: Deploy Lumina Store API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Api/**'
      - '.github/workflows/deploy-lumina-api.yml'

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Api/Shop.Api.csproj

      - name: Build API
        run: dotnet build Api/Shop.Api.csproj --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish Api/Shop.Api.csproj --configuration Release --output ./publish/api --no-build

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME }}
          package: ./publish/api
